# log all connections and disconnections
log_connections = on
log_disconnections = on

# log all DDL (CREATE, DROP, ALTER)
log_statement = 'ddl'

# log queries that take longer than 1s
log_min_duration_statement = 1000

# log failed authentication attempts
log_failed_connections = on

# include useful context in every log line
log_line_prefix = '%t [%p] [%u@%d] [%r] '
# %t = timestamp, %p = process id, %u = username, %d = database, %r = remote host

# log lock waits longer than 500ms
deadlock_timeout = 500ms
log_lock_waits = on

# send logs to stderr (docker should capture this)
log_destination = 'stderr'
logging_collector = off